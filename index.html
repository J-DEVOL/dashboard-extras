<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Controle de Horas Extras</title>
</head>
<body>
    <h1>Dashboard - Lançamento de Horas Extras</h1>
    <button onclick="salvarEAtualizar()">GRAVAR ALTERAÇÕES</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAt34GhxkLzDwMcugyqLRTTrKl2dQvGBRM",
            authDomain: "dashboard-horas-extras.firebaseapp.com",
            projectId: "dashboard-horas-extras",
            storageBucket: "dashboard-horas-extras.firebasestorage.app",
            messagingSenderId: "323819838419",
            appId: "1:323819838419:web:da55fd1d7473e9159c6d26"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "bancoHorasExtras", "registroAtual"); 

        window.salvarEAtualizar = async function() {
            // Dados fixos conforme image_d8e25f.png
            const novoEstado = {
                historico: {
                    sexta: { data: "05/06", turno1: 0, turno2: 6, turno3: 39, total: 45 },
                    sabado: { data: "06/06", turno1: 56, turno2: 3, turno3: 10, total: 69 },
                    domingo: { data: "07/06", turno1: 54, turno2: 2, turno3: 0, total: 56 }
                },
                preenchimentoAtual: {
                    data: "11/06/2026",
                    turno1: 0,
                    turno2: 0,
                    turno3: 0
                }
            };

            try {
                // setDoc sobrescreve o documento, zerando qualquer histórico anterior
                await setDoc(docRef, novoEstado); 
                alert("Histórico zerado e atualizado com sucesso!");
                location.reload();
            } catch (error) {
                console.error("Erro ao atualizar Firebase:", error);
                alert("Erro ao comunicar com Firebase.");
            }
        };
    </script>
</body>
</html>
